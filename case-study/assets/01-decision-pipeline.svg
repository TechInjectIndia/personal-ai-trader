<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Helm LLM-gated trading loop: mechanical signals propose, Claude judges, a hard risk gate guards, and Claude grades the outcome.">
  <title>Helm — the LLM-gated trading loop</title>
  <desc>Cron polls market data into Postgres; strategies emit signals; Claude Sonnet decides TAKE or SKIP; a hard risk gate guards execution; trades are managed to close; a second Claude call grades the outcome into plain-English learnings that feed the self-improvement loop.</desc>
  <style>
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;}
    .db{fill:#e0f2fe;stroke:#0ea5e9;stroke-width:1.5;}
    .llm{fill:#ede9fe;stroke:#7c3aed;stroke-width:1.5;}
    .gate{fill:#fef3c7;stroke:#d97706;stroke-width:1.5;}
    .act{fill:#dcfce7;stroke:#16a34a;stroke-width:1.5;}
    .t{fill:#0f172a;font-size:15px;font-weight:600;text-anchor:middle;}
    .ts{fill:#475569;font-size:11.5px;text-anchor:middle;}
    .lbl{fill:#475569;font-size:11.5px;text-anchor:middle;}
    .arr{stroke:#94a3b8;stroke-width:1.8;fill:none;}
    .darr{stroke:#a78bfa;stroke-width:1.8;fill:none;stroke-dasharray:5 4;}
    .title{fill:#0f172a;font-size:25px;font-weight:700;}
    .sub{fill:#64748b;font-size:14px;}
    .tag{fill:#7c3aed;font-size:12px;font-weight:700;letter-spacing:.5px;}
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#a78bfa"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
  <text x="40" y="48" class="tag">LAYER 1</text>
  <text x="40" y="78" class="title">The LLM-gated trading loop</text>
  <text x="40" y="104" class="sub">Mechanical signals propose · Claude judges every one · a hard risk gate guards · Claude grades the result</text>

  <!-- ROW A -->
  <g>
    <rect class="box" x="40"  y="137" width="160" height="66" rx="10"/>
    <text class="t" x="120" y="166">Cron</text><text class="ts" x="120" y="186">every minute, NSE hrs</text>
    <rect class="box" x="270" y="137" width="160" height="66" rx="10"/>
    <text class="t" x="350" y="166">Poll market</text><text class="ts" x="350" y="186">yfinance LTP</text>
    <path class="db" d="M500,150 a80,12 0 0 0 160,0 v40 a80,12 0 0 1 -160,0 z"/>
    <ellipse class="db" cx="580" cy="150" rx="80" ry="12"/>
    <text class="t" x="580" y="170">Postgres</text><text class="ts" x="580" y="187">candles_1m</text>
    <rect class="box" x="730" y="137" width="160" height="66" rx="10"/>
    <text class="t" x="810" y="162">Strategy scan</text><text class="ts" x="810" y="180">ORB · VWAP · gap-fade</text><text class="ts" x="810" y="195">pure, no DB access</text>
    <rect class="box" x="960" y="137" width="160" height="66" rx="10"/>
    <text class="t" x="1040" y="166">Signal row</text><text class="ts" x="1040" y="186">consumed=false</text>
  </g>

  <!-- ROW B -->
  <g>
    <rect class="llm" x="960" y="327" width="160" height="66" rx="10"/>
    <text class="t" x="1040" y="354">Claude · DECIDE</text><text class="ts" x="1040" y="372">Sonnet 4.6</text><text class="ts" x="1040" y="387">TAKE / SKIP + reason</text>
    <polygon class="gate" points="810,313 887,360 810,407 733,360"/>
    <text class="t" x="810" y="356">RISK</text><text class="t" x="810" y="372">GATE</text>
    <rect class="act" x="500" y="327" width="160" height="66" rx="10"/>
    <text class="t" x="580" y="354">Paper trade</text><text class="ts" x="580" y="372">dynamic position cap</text><text class="ts" x="580" y="387">₹15k → ₹25k</text>
    <rect class="box" x="270" y="327" width="160" height="66" rx="10"/>
    <text class="t" x="350" y="354">Manage</text><text class="ts" x="350" y="372">stop / target / 15:15</text><text class="ts" x="350" y="387">square-off</text>
  </g>

  <!-- ROW C -->
  <g>
    <rect class="llm" x="270" y="517" width="160" height="66" rx="10"/>
    <text class="t" x="350" y="544">Claude · RETRO</text><text class="ts" x="350" y="562">plain-English grade</text><text class="ts" x="350" y="577">GOOD/BAD/LUCKY…</text>
    <rect class="box" x="500" y="517" width="160" height="66" rx="10"/>
    <text class="t" x="580" y="544">Verdict + scores</text><text class="ts" x="580" y="562">signal·decision·exec</text><text class="ts" x="580" y="577">+ 1–3 learnings</text>
    <rect class="box" x="730" y="517" width="160" height="66" rx="10"/>
    <text class="t" x="810" y="550">improvement_</text><text class="t" x="810" y="568">proposals</text>
    <rect class="box" x="960" y="517" width="160" height="66" rx="10" stroke-dasharray="5 4" stroke="#a78bfa"/>
    <text class="t" x="1040" y="544" fill="#6d28d9">Layer 2</text><text class="ts" x="1040" y="562" fill="#7c3aed">self-improvement</text><text class="ts" x="1040" y="577" fill="#7c3aed">loop</text>
  </g>

  <!-- ROW A arrows -->
  <path class="arr" marker-end="url(#a)" d="M200,170 H266"/>
  <path class="arr" marker-end="url(#a)" d="M430,170 H496"/>
  <path class="arr" marker-end="url(#a)" d="M660,170 H726"/>
  <path class="arr" marker-end="url(#a)" d="M890,170 H956"/>
  <text class="lbl" x="465" y="162">tick</text>
  <text class="lbl" x="693" y="162">1-min OHLC</text>

  <!-- A -> B -->
  <path class="arr" marker-end="url(#a)" d="M1040,203 V323"/>
  <text class="lbl" x="1100" y="268">context: 30 bars +</text>
  <text class="lbl" x="1100" y="283">risk + prior calls</text>

  <!-- ROW B arrows (right to left) -->
  <path class="arr" marker-end="url(#a)" d="M960,360 H892"/>
  <text class="lbl" x="925" y="350">TAKE</text>
  <path class="arr" marker-end="url(#a)" d="M733,360 H664"/>
  <text class="lbl" x="698" y="350">pass</text>
  <path class="arr" marker-end="url(#a)" d="M500,360 H434"/>

  <!-- B -> C -->
  <path class="arr" marker-end="url(#a)" d="M350,393 V513"/>
  <text class="lbl" x="410" y="458">closed trade</text>

  <!-- ROW C arrows -->
  <path class="arr" marker-end="url(#a)" d="M430,550 H496"/>
  <path class="arr" marker-end="url(#a)" d="M660,550 H726"/>
  <path class="darr" marker-end="url(#ap)" d="M890,550 H956"/>

  <!-- feedback: improvements ship back to decider/strategies -->
  <path class="darr" marker-end="url(#ap)" d="M1040,517 V399"/>
  <text class="lbl" x="1095" y="460" fill="#7c3aed">ships fixes</text>

  <!-- legend -->
  <g transform="translate(40,628)">
    <rect class="db" x="0" y="0" width="16" height="14" rx="3"/><text x="22" y="11" class="ts" text-anchor="start">Data store</text>
    <rect class="llm" x="120" y="0" width="16" height="14" rx="3"/><text x="142" y="11" class="ts" text-anchor="start">LLM step (Claude)</text>
    <polygon class="gate" points="300,0 314,7 300,14 286,7"/><text x="322" y="11" class="ts" text-anchor="start">Hard risk gate</text>
    <rect class="act" x="430" y="0" width="16" height="14" rx="3"/><text x="452" y="11" class="ts" text-anchor="start">Action</text>
    <rect x="540" y="0" width="16" height="14" rx="3" fill="#fff" stroke="#a78bfa" stroke-dasharray="4 3"/><text x="562" y="11" class="ts" text-anchor="start">Feedback to learning loop</text>
  </g>
</svg>
