<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Helm platform overview: three layers — an LLM-gated trading loop, a self-improvement agent loop, and a multi-agent competition league — share one PostgreSQL database, surfaced by one Streamlit dashboard.">
  <title>Helm — platform overview</title>
  <desc>An LLM-gated, self-improving, multi-agent trading platform. Three layers share one PostgreSQL database: Layer 1 is a live LLM-gated trading loop; Layer 2 is a self-improvement loop where PM, Engineer, and Tester agents ship and verify code; Layer 3 is a competition league of five AI backends with isolated wallets. One Streamlit dashboard reads it all.</desc>
  <style>
    .ts{fill:#475569;font-size:12.5px;text-anchor:start;}
    .db{fill:#e0f2fe;stroke:#0ea5e9;stroke-width:2;}
    .arr{stroke:#94a3b8;stroke-width:2;fill:none;}
    .title{fill:#0f172a;font-size:27px;font-weight:800;text-anchor:middle;}
    .sub{fill:#64748b;font-size:15px;text-anchor:middle;}
    .hd{font-size:15px;font-weight:800;fill:#0f172a;text-anchor:start;}
    .stat{fill:#334155;font-size:13px;text-anchor:middle;}
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6 z" fill="#94a3b8"/></marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
  <text x="600" y="50" class="title">Helm</text>
  <text x="600" y="80" class="sub">An LLM-gated, self-improving, multi-agent trading platform — built on a real backend, not a no-code prototype</text>

  <!-- dashboard bar -->
  <rect x="330" y="118" width="540" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="143" text-anchor="middle" class="hd">Streamlit dashboard</text>
  <text x="600" y="162" text-anchor="middle" fill="#475569" font-size="12.5">8 pages · read-only over Postgres · operator + judge view</text>
  <path class="arr" marker-end="url(#a)" d="M600,174 V276"/>
  <text x="618" y="228" class="ts">reads</text>

  <!-- central Postgres -->
  <ellipse class="db" cx="600" cy="300" rx="105" ry="22"/>
  <path class="db" d="M495,300 V400 a105,22 0 0 0 210,0 V300" fill="#e0f2fe"/>
  <ellipse class="db" cx="600" cy="300" rx="105" ry="22"/>
  <text x="600" y="352" text-anchor="middle" font-size="17" font-weight="800" fill="#075985">PostgreSQL</text>
  <text x="600" y="374" text-anchor="middle" font-size="12.5" fill="#0369a1">20 tables · one DB · audited</text>

  <!-- LAYER 1 panel (left) -->
  <rect x="40" y="245" width="285" height="215" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="40" y="245" width="285" height="34" rx="14" fill="#dcfce7"/>
  <rect x="40" y="262" width="285" height="17" fill="#dcfce7"/>
  <text x="58" y="268" class="hd">LAYER 1 · Trading loop</text>
  <rect x="262" y="252" width="50" height="20" rx="10" fill="#16a34a"/><text x="287" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">LIVE</text>
  <text x="58" y="306" class="ts">• poll market → 1-min candles</text>
  <text x="58" y="330" class="ts">• 3 strategies → signals</text>
  <text x="58" y="354" class="ts">• <tspan fill="#7c3aed" font-weight="700">Claude</tspan> decides TAKE / SKIP</text>
  <text x="58" y="378" class="ts">• hard risk gate → paper trade</text>
  <text x="58" y="402" class="ts">• manage → stop / target / EOD</text>
  <text x="58" y="430" class="ts" font-style="italic">• <tspan fill="#7c3aed" font-weight="700">Claude</tspan> grades every outcome</text>

  <!-- LAYER 3 panel (right) -->
  <rect x="875" y="245" width="285" height="215" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.8"/>
  <rect x="875" y="245" width="285" height="34" rx="14" fill="#e0f2fe"/>
  <rect x="875" y="262" width="285" height="17" fill="#e0f2fe"/>
  <text x="893" y="268" class="hd">LAYER 3 · Competition league</text>
  <rect x="1095" y="252" width="54" height="20" rx="10" fill="#0ea5e9"/><text x="1122" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">BUILT</text>
  <text x="893" y="306" class="ts">• 5 AI backends compete</text>
  <text x="893" y="330" class="ts">• isolated ₹50k wallets each</text>
  <text x="893" y="354" class="ts">• one shared risk gate</text>
  <text x="893" y="378" class="ts">• per-backend quota control</text>
  <text x="893" y="402" class="ts">• leaderboard + "how it thinks"</text>
  <text x="893" y="430" class="ts" font-style="italic">• equity AND reasoning ranked</text>

  <!-- LAYER 2 panel (bottom) -->
  <rect x="380" y="498" width="440" height="140" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <rect x="380" y="498" width="440" height="34" rx="14" fill="#ede9fe"/>
  <rect x="380" y="515" width="440" height="17" fill="#ede9fe"/>
  <text x="398" y="521" class="hd">LAYER 2 · Self-improvement loop</text>
  <rect x="758" y="505" width="54" height="20" rx="10" fill="#7c3aed"/><text x="785" y="519" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">BUILT</text>
  <text x="600" y="558" text-anchor="middle" font-size="12.5" fill="#475569">retros → proposals → <tspan fill="#7c3aed" font-weight="700">PM agent</tspan> → <tspan fill="#7c3aed" font-weight="700">Engineer</tspan> (commits) → Tester (verifies/reverts)</text>
  <text x="600" y="580" text-anchor="middle" font-size="12.5" fill="#475569">→ human reviews &amp; pushes → change goes live</text>
  <text x="600" y="608" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b21b6">the system edits and tests itself · main always green</text>

  <!-- connectors to Postgres -->
  <path class="arr" marker-start="url(#b)" marker-end="url(#a)" d="M325,352 H493"/>
  <path class="arr" marker-start="url(#b)" marker-end="url(#a)" d="M875,352 H707"/>
  <path class="arr" marker-start="url(#b)" marker-end="url(#a)" d="M600,498 V424"/>

  <!-- stats band -->
  <line x1="40" y1="652" x2="1160" y2="652" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="672" class="stat">~13,300 LOC Python  ·  20 Postgres tables  ·  8 dashboard pages  ·  5 competing agents  ·  3 self-improvement agents  ·  $0 POC cost</text>
</svg>
